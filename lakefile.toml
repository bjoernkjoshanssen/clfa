name = "RequestProject"
defaultTargets = ["RequestProject"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "J2Fast"
roots = ["J2Fast"]
globs = ["J2Fast", "J2Fast.+"]
libName = "J2Fast"
precompileModules = true
